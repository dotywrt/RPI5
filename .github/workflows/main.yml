name: RPI5 BUILDER 🚀

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Add extra swap
        run: |
          sudo fallocate -l 8G /swapfile2 || sudo dd if=/dev/zero of=/swapfile2 bs=1M count=8192
          sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2
          sudo swapon /swapfile2 || true
          free -h

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo docker image prune -a -f || true
          sudo apt-get clean
          df -hT

      - name: Install deps
        run: |
          sudo apt update -y
          sudo apt install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 rsync unzip zlib1g-dev \
            file wget curl

      - name: Clean old build files
        run: |
          rm -rf dl build_dir staging_dir tmp .ccache

      - name: Prepare feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Patch Rust Makefile disable CI LLVM
        run: |
          sed -i 's/llvm\.download-ci-llvm=true/llvm.download-ci-llvm=false/g' feeds/packages/lang/rust/Makefile
          grep -n "llvm.download-ci-llvm" feeds/packages/lang/rust/Makefile || true

      - name: Load RPI5 config
        run: |
          cp RPI5.config .config

      - name: Build firmware
        run: |
          make defconfig
          make download -j6 || make download -j1 V=s
          make -j$(nproc) || make -j1 V=s

      - name: Upload bin folder artifact
        uses: actions/upload-artifact@v4
        with:
          name: RPI5-bin
          path: bin/
          if-no-files-found: error
          retention-days: 7
